name: Garder le site actif (anti mise en veille Render)

# Le plan gratuit Render met le service en veille après 15 minutes sans
# requête (et le réveil suivant prend 30-60s). Ce ping toutes les 5 minutes
# maintient le service éveillé pendant une présentation ou une session de
# test prolongée. Peut aussi être déclenché manuellement juste avant de
# présenter (bouton "Run workflow" dans l'onglet Actions de GitHub) pour
# être certain que le site est déjà réveillé.
#
# Limite à connaître : ceci évite la mise en veille pour inactivité, mais ne
# protège pas contre un nouveau déploiement (push sur main) — un déploiement
# redémarre le service et réinitialise la base de données (pas de disque
# persistant sur le plan gratuit). Éviter de pousser du code pendant une
# présentation en cours.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/5 * * * *"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: curl -fsS --max-time 20 https://one-click-bp.onrender.com/api/health
